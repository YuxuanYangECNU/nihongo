name: Verify and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test browser interactions
        run: |
          python3 -m http.server 4173 > /tmp/nihongo-server.log 2>&1 &
          node tests/browser.cjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results/
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
